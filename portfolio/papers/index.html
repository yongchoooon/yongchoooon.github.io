<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yongdeuk Seo | Paper &amp; Project</title>
  <meta
    name="description"
    content="Detailed paper and project highlights by Yongdeuk Seo."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page">
    <header>
      <div class="topbar">
        <nav class="topnav" aria-label="Page links">
          <a href="../" data-topnav-key="home">Home</a>
          <a class="is-active" href="./" data-topnav-key="papers">Paper &amp; Project</a>
        </nav>
        <button class="lang-toggle" id="lang-toggle" type="button" aria-label="View in Korean">
          <span class="lang-option" data-lang-option="en">EN</span>
          <span class="lang-separator" aria-hidden="true"></span>
          <span class="lang-option" data-lang-option="ko">KO</span>
        </button>
      </div>
    </header>

    <main class="detail-main">
      <header class="detail-hero">
        <p class="detail-eyebrow" id="detail-eyebrow"></p>
        <h1 class="detail-title" id="detail-title"></h1>
        <div class="detail-legend" id="detail-legend"></div>
      </header>

      <div class="detail-sections" id="detail-sections"></div>
    </main>

    <footer class="footer" id="footer-text"></footer>
  </div>

  <div class="image-lightbox" id="image-lightbox" hidden>
    <div class="image-lightbox-backdrop" id="image-lightbox-backdrop"></div>
    <div class="image-lightbox-dialog" role="dialog" aria-modal="true" aria-label="Expanded image preview">
      <button class="image-lightbox-dismiss" id="image-lightbox-dismiss" type="button" aria-label="Close image preview">×</button>
      <img class="image-lightbox-image" id="image-lightbox-image" alt="">
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
