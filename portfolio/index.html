<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서용득 | Portfolio</title>
  <meta name="description" content="서용득 연구원의 학력, 연구 경력, 프로젝트, 특허, 수상 이력을 확인하고 포트폴리오 PDF를 바로 열어보세요.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f1ee;
      --bg-soft: #f7f6f3;
      --card: #ffffff;
      --border: #ded9d2;
      --border-strong: #c9c3bb;
      --text: #1f1f1f;
      --muted: #5a5754;
      --accent: #ff6b3b;
      --accent-soft: rgba(255, 107, 59, 0.12);
      --accent-dark: #d85124;
      --tag-muted-bg: rgba(102, 94, 88, 0.08);
      --tag-muted-text: #6d6965;
      color-scheme: light;
      font-size: 17px;
    }

    body.dark {
      --bg: linear-gradient(180deg, #0b1120 0%, #0f172a 65%, #020617 100%);
      --bg-soft: #0e172c;
      --card: rgba(16, 27, 52, 0.92);
      --border: rgba(148, 163, 184, 0.18);
      --border-strong: rgba(148, 163, 184, 0.35);
      --text: #e2e8f0;
      --muted: rgba(226, 232, 240, 0.72);
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.18);
      --accent-dark: #0ea5e9;
      --tag-muted-bg: rgba(148, 163, 184, 0.16);
      --tag-muted-text: rgba(226, 232, 240, 0.8);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Noto Sans KR', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      letter-spacing: -0.01em;
      transition: background 0.3s ease, color 0.3s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    .banner {
      background: #0f0f0f;
      color: #f7f6f3;
      padding: 18px 0;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .container {
      width: min(1440px, 98vw);
      margin: 0 auto;
    }

    header {
      background: var(--bg-soft);
      border-bottom: 1px solid var(--border);
      padding: 60px 0 42px;
    }

    .header-toolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 16px;
      gap: 12px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(160px, 240px) 1fr;
      gap: 32px;
      align-items: center;
    }

    .hero__photo {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      box-shadow: 0 12px 28px rgba(17, 17, 17, 0.08);
      max-width: 220px;
      position: relative;
      cursor: pointer;
    }

    .hero__photo:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .hero__photo img {
      display: block;
      width: 100%;
      height: auto;
    }

    .thumbs-pop {
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: 2.6rem;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -30%) scale(0.5);
      transform-origin: center;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.25));
      will-change: transform, opacity;
    }

    .thumbs-pop.is-active {
      animation: thumbs-burst 0.9s ease-out forwards;
    }

    @keyframes thumbs-burst {
      0% {
        transform: translate(-50%, -30%) scale(0.4) rotate(0deg);
        opacity: 0;
      }
      25% {
        transform: translate(-50%, -70%) scale(1.05) rotate(-12deg);
        opacity: 1;
      }
      55% {
        transform: translate(-46%, -105%) scale(1) rotate(10deg);
        opacity: 1;
      }
      80% {
        transform: translate(-54%, -130%) scale(1) rotate(-6deg);
        opacity: 0.8;
      }
      100% {
        transform: translate(-50%, -160%) scale(1) rotate(0deg);
        opacity: 0;
      }
    }

    .theme-toggle,
    .language-toggle {
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 8px 16px;
      min-height: 40px;
      font-size: 0.95rem;
      font-weight: 600;
      background: var(--card);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .theme-toggle:hover,
    .language-toggle:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
    }

    .language-toggle__option {
      opacity: 0.55;
      letter-spacing: 0.06em;
    }

    .language-toggle__divider {
      width: 1px;
      height: 14px;
      background: var(--border-strong);
      display: inline-block;
    }

    .language-toggle[data-active-lang="ko"] .language-toggle__option[data-lang-option="ko"],
    .language-toggle[data-active-lang="en"] .language-toggle__option[data-lang-option="en"] {
      opacity: 1;
      color: var(--accent-dark);
    }

    .theme-toggle__icon {
      font-size: 1.1rem;
    }

    .hero__heading {
      display: grid;
      gap: 12px;
    }

    .hero__eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .hero__eyebrow-rule {
      width: 34px;
      height: 1px;
      background: var(--border-strong);
      display: inline-block;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.15rem, 3.4vw, 2.85rem);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    html[lang="en"] #hero-title {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
    }

    .hero__lead-list {
      margin: 0;
      padding-left: 22px;
      display: grid;
      gap: 10px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .hero__lead-list li {
      line-height: 1.65;
    }

    .contact-row {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      font-weight: 600;
    }

    .contact-row a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-dark);
    }

    .contact-row a::before {
      content: attr(data-label);
      font-weight: 700;
      color: #111;
      margin-right: 4px;
    }

    main {
      padding: 64px 0 80px;
    }

    .overview {
      display: grid;
      gap: 32px;
      margin-bottom: 60px;
    }

    .overview__lead {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      display: grid;
      gap: 12px;
      box-shadow: 0 10px 26px rgba(17, 17, 17, 0.04);
    }

    .overview__lead h2 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
    }

    .overview__list {
      margin: 0;
      padding-left: 22px;
      display: grid;
      gap: 10px;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.65;
    }

    .overview__layout {
      display: grid;
      grid-template-columns: 6.7fr 3.3fr;
      gap: 20px;
      align-items: stretch;
    }

    .overview__left,
    .overview__right {
      gap: 18px;
      min-height: 0;
    }

    .overview__left {
      display: grid;
      grid-auto-rows: minmax(0, auto);
      align-content: start;
    }

    .overview__right {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 18px;
      height: 100%;
    }

    .overview__right > .card {
      height: 100%;
    }

    .overview__left {
      grid-template-rows: repeat(4, auto);
    }

    .overview__right {
      grid-template-rows: repeat(2, auto);
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 22px;
      display: grid;
      gap: 12px;
      box-shadow: 0 10px 24px rgba(17, 17, 17, 0.05);
      height: auto;
      align-content: start;
    }

    .card--scroll {
      overflow: visible;
      max-height: none;
      padding-right: 0;
    }

    .timeline {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .timeline li {
      display: grid;
      grid-template-columns: auto auto auto 1fr;
      column-gap: 12px;
      position: relative;
      padding-left: 16px;
      align-items: start;
    }

    .timeline li::before {
      content: '•';
      position: absolute;
      left: 0;
      top: 0.25em;
      color: var(--accent-dark);
      font-size: 1.1rem;
      line-height: 1;
    }

    .timeline__date {
      display: inline-block;
      min-width: 14ch;
      font-weight: 600;
      white-space: nowrap;
    }

    .timeline--compact {
      gap: 4px;
    }

    .timeline--compact li {
      grid-template-columns: auto auto 1fr;
    }

    .timeline--compact .timeline__date {
      min-width: 6ch;
    }

    .timeline__divider {
      color: var(--muted);
      font-weight: 600;
    }

    .timeline__text {
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .timeline__action {
      border: none;
      background: var(--accent-soft);
      color: var(--accent-dark);
      border-radius: 999px;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .timeline__link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px 4px 8px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .timeline__link--springer {
      background: rgba(56, 189, 248, 0.14);
      color: #0b3d8c;
      border-color: rgba(11, 61, 140, 0.12);
    }

    body.dark .timeline__link--springer {
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.35);
    }

    .timeline__link--arxiv {
      background: rgba(179, 27, 28, 0.12);
      color: #b31b1c;
      border-color: rgba(179, 27, 28, 0.25);
    }

    body.dark .timeline__link--arxiv {
      background: rgba(179, 27, 28, 0.2);
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.45);
    }

    .timeline__link--github {
      background: #0f172a;
      color: #f8fafc;
      border-color: rgba(15, 23, 42, 0.8);
    }

    body.dark .timeline__link--github {
      background: rgba(248, 250, 252, 0.18);
      color: #0f172a;
      border-color: rgba(248, 250, 252, 0.35);
    }

    body.dark .timeline__link:hover {
      box-shadow: 0 8px 18px rgba(2, 132, 199, 0.3);
    }

    body.dark .timeline__link:focus-visible {
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.5);
    }

    .timeline__link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(11, 61, 140, 0.15);
    }

    .timeline__link:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 0 0 3px rgba(11, 61, 140, 0.35);
      outline: none;
    }

    .timeline__link-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #0b3d8c;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    body.dark .timeline__link-icon {
      background: #1d4ed8;
    }

    .timeline__link--springer .timeline__link-icon {
      background: #0b3d8c;
      color: #ffffff;
    }

    body.dark .timeline__link--springer .timeline__link-icon {
      background: #38bdf8;
      color: #04142d;
    }

    .timeline__link--arxiv .timeline__link-icon {
      background: #b31b1c;
    }

    body.dark .timeline__link--arxiv .timeline__link-icon {
      background: #f87171;
      color: #111827;
    }

    .timeline__link--github .timeline__link-icon {
      background: #f8fafc;
      color: #0f172a;
    }

    body.dark .timeline__link--github .timeline__link-icon {
      background: #0f172a;
      color: #f8fafc;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .timeline__action:hover,
    .timeline__action:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
      outline: none;
    }

    .card h3 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      position: relative;
      padding-bottom: 10px;
    }

    .card h3::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 32px;
      height: 3px;
      border-radius: 999px;
      background: var(--accent);
    }

    .meta {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.95rem;
    }

    ul {
      margin: 0;
      padding-left: 18px;
      color: var(--text);
      font-size: 0.95rem;
    }

    ul li + li {
      margin-top: 4px;
    }

    .tag-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 6px 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .tag--primary {
      background: var(--accent-soft);
      color: var(--accent-dark);
    }

    .tag--secondary {
      background: var(--tag-muted-bg);
      color: var(--tag-muted-text);
      border: 1px solid rgba(109, 105, 101, 0.25);
    }

    .skill-group {
      display: grid;
      gap: 10px;
    }

    .skill-group + .skill-group {
      margin-top: 14px;
      padding-top: 6px;
    }

    .skill-group h4 {
      margin: 0;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .pdf-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 20px 45px rgba(17, 17, 17, 0.07);
    }

    .pdf-section header {
      padding: 0 0 20px;
      background: none;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      display: grid;
      gap: 10px;
    }

    .pdf-section h2 {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
    }

    .pdf-section p {
      margin: 0;
      color: var(--muted);
    }

    .pdf-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.98rem;
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff7f3;
      box-shadow: 0 10px 22px rgba(255, 107, 59, 0.28);
    }

    .btn-secondary {
      background: #ffffff;
      border-color: var(--border-strong);
      color: #141414;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .pdf-stage {
      display: grid;
      gap: 20px;
    }

    .pdf-viewer {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #0f0f0f;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 16 / 9;
    }

    .pdf-viewer img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #0f0f0f;
    }

    .pdf-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .page-indicator {
      font-weight: 600;
      color: var(--muted);
    }

    footer {
      text-align: center;
      padding: 60px 0 40px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 980px) {
      .overview__layout {
        grid-template-columns: 1fr;
      }

      .overview__left,
      .overview__right {
        grid-template-rows: none;
        min-height: auto;
      }
    }

    @media (max-width: 720px) {
      header {
        padding: 48px 0 36px;
      }

      .header-toolbar {
        justify-content: center;
      }

      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .hero__photo {
        margin: 0 auto;
      }

      .contact-row {
        justify-content: center;
      }

      .overview__lead,
      .card {
        padding: 24px;
      }

      .pdf-section {
        padding: 26px;
      }

      .pdf-viewer {
        aspect-ratio: auto;
        height: 70vh;
      }
    }
  </style>
</head>
<body>
  <div class="banner" id="banner-title"></div>
  <header>
    <div class="container header-toolbar">
      <button class="language-toggle" id="language-toggle" type="button" aria-label="영어로 보기" data-active-lang="ko">
        <span class="language-toggle__option" data-lang-option="ko">한</span>
        <span class="language-toggle__divider" aria-hidden="true"></span>
        <span class="language-toggle__option" data-lang-option="en">EN</span>
      </button>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="다크 모드로 전환">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        <span id="theme-toggle-text">Mode</span>
      </button>
    </div>
    <div class="container hero">
      <div class="hero__photo" role="button" tabindex="0" id="hero-photo" aria-label="">
        <img src="imgs/profile.jpg" id="hero-photo-img" alt="">
        <div class="thumbs-pop" aria-hidden="true">👍🏻</div>
      </div>
        <div class="hero__heading">
          <div class="hero__eyebrow">
            <span class="hero__eyebrow-rule" aria-hidden="true"></span>
            <span id="hero-eyebrow"></span>
          </div>
          <h1 id="hero-title"></h1>
          <ul class="hero__lead-list" id="hero-bullets"></ul>
          <div class="contact-row">
            <a href="tel:+821030468377" data-label="M.">010-3046-8377</a>
            <a href="mailto:sod7050@gmail.com" data-label="E.">sod7050@gmail.com</a>
            <a href="https://github.com/yongchoooon" target="_blank" rel="noreferrer noopener" data-label="W.">github.com/yongchoooon</a>
          </div>
        </div>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="overview">
        <div class="overview__lead">
          <h2 id="overview-title"></h2>
          <ul class="overview__list" id="overview-bullets"></ul>
        </div>
        <div class="overview__layout">
          <div class="overview__left">
            <article class="card card--grad">
              <h3 id="education-title"></h3>
              <ul class="timeline" id="education-list"></ul>
            </article>
            <article class="card card--experience">
              <h3 id="experience-title"></h3>
              <ul class="timeline" id="experience-list"></ul>
            </article>
            <article class="card card--projects card--scroll">
              <h3 id="projects-title"></h3>
              <ul class="timeline" id="projects-list"></ul>
            </article>
            <article class="card card--awards">
              <h3 id="awards-title"></h3>
              <ul class="timeline" id="awards-list"></ul>
            </article>
          </div>
          <div class="overview__right">
            <article class="card card--patent">
              <h3 id="patent-title"></h3>
              <ul class="timeline timeline--compact" id="patent-list"></ul>
            </article>
            <article class="card card--skill card--scroll">
              <h3 id="skills-title"></h3>
              <div id="skill-groups"></div>
            </article>
          </div>
        </div>
      </section>

      <section class="pdf-section" aria-labelledby="pdf-title">
        <header>
          <h2 id="pdf-title"></h2>
          <div class="pdf-actions">
            <a class="btn btn-primary" id="pdf-download" href="Portfolio-YongdeukSeo.pdf" download></a>
            <a class="btn btn-secondary" id="pdf-open" href="Portfolio-YongdeukSeo.pdf" target="_blank" rel="noreferrer noopener"></a>
          </div>
        </header>
        <div class="pdf-stage">
          <div class="pdf-viewer">
            <img id="pdf-slide" src="imgs/slides/portfolio-page-01.png" alt="">
          </div>
          <div class="pdf-nav">
            <button class="btn btn-secondary" id="prev-page" type="button"></button>
            <span class="page-indicator"><span id="current-page">1</span> / <span id="total-pages">10</span></span>
            <button class="btn btn-secondary" id="next-page" type="button"></button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer id="footer-text"></footer>

  <script>
    const LANGUAGE_FILES = {
      ko: 'content/portfolio-ko.json',
      en: 'content/portfolio-en.json'
    };
    const contentCache = {};
    let currentLang = 'ko';
    let currentCopy = null;
    let pdfAltTemplate = 'Portfolio page {page}';

    const TOTAL_PAGES = 10;
    const imagePrefix = 'imgs/slides/portfolio-page-';
    const imageEl = document.getElementById('pdf-slide');
    const currentPageEl = document.getElementById('current-page');
    const totalPagesEl = document.getElementById('total-pages');
    const prevBtn = document.getElementById('prev-page');
    const nextBtn = document.getElementById('next-page');
    const pdfSection = document.querySelector('.pdf-section');
    let currentPage = 1;

    const bannerEl = document.getElementById('banner-title');
    const heroEyebrowText = document.getElementById('hero-eyebrow');
    const heroTitleEl = document.getElementById('hero-title');
    const heroBulletList = document.getElementById('hero-bullets');
    const heroPhoto = document.getElementById('hero-photo');
    const heroPhotoImg = document.getElementById('hero-photo-img');
    const thumbsPop = heroPhoto ? heroPhoto.querySelector('.thumbs-pop') : null;

    const overviewTitleEl = document.getElementById('overview-title');
    const overviewBulletList = document.getElementById('overview-bullets');

    const educationTitleEl = document.getElementById('education-title');
    const educationListEl = document.getElementById('education-list');
    const experienceTitleEl = document.getElementById('experience-title');
    const experienceListEl = document.getElementById('experience-list');
    const projectsTitleEl = document.getElementById('projects-title');
    const projectsListEl = document.getElementById('projects-list');
    const awardsTitleEl = document.getElementById('awards-title');
    const awardsListEl = document.getElementById('awards-list');
    const patentTitleEl = document.getElementById('patent-title');
    const patentListEl = document.getElementById('patent-list');
    const skillsTitleEl = document.getElementById('skills-title');
    const skillGroupsEl = document.getElementById('skill-groups');

    const pdfTitleEl = document.getElementById('pdf-title');
    const pdfDownloadEl = document.getElementById('pdf-download');
    const pdfOpenEl = document.getElementById('pdf-open');
    const footerEl = document.getElementById('footer-text');

    const languageToggleBtn = document.getElementById('language-toggle');
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeToggleIcon = themeToggleBtn ? themeToggleBtn.querySelector('.theme-toggle__icon') : null;
    const themeToggleText = document.getElementById('theme-toggle-text');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

    const FALLBACK_THEME_LABELS = {
      light: 'Switch to light mode',
      dark: 'Switch to dark mode'
    };

    if (totalPagesEl) {
      totalPagesEl.textContent = TOTAL_PAGES;
    }

    function setText(element, value = '') {
      if (element) {
        element.textContent = value ?? '';
      }
    }

    function renderList(listEl, items, options = {}) {
      if (!listEl) return;
      listEl.innerHTML = '';
      if (!Array.isArray(items)) return;
      items.forEach((item) => {
        if (item === undefined || item === null) return;
        const li = document.createElement('li');
        if (options.html) {
          li.innerHTML = item;
        } else {
          li.textContent = item;
        }
        listEl.appendChild(li);
      });
    }

    function createLinkElement(link) {
      const anchor = document.createElement('a');
      anchor.className = 'timeline__link';
      if (link.variant) {
        anchor.classList.add(`timeline__link--${link.variant}`);
      }
      anchor.href = link.href;
      anchor.target = '_blank';
      anchor.rel = 'noreferrer noopener';
      if (link.icon) {
        const icon = document.createElement('span');
        icon.className = 'timeline__link-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = link.icon;
        anchor.appendChild(icon);
      }
      anchor.appendChild(document.createTextNode(link.label || 'Link'));
      if (link.srText) {
        const sr = document.createElement('span');
        sr.className = 'sr-only';
        sr.textContent = link.srText;
        anchor.appendChild(sr);
      }
      return anchor;
    }

    function renderTimeline(listEl, items) {
      if (!listEl) return;
      listEl.innerHTML = '';
      if (!Array.isArray(items)) return;
      items.forEach((item) => {
        if (!item) return;
        const li = document.createElement('li');
        const dateEl = document.createElement('span');
        dateEl.className = 'timeline__date';
        dateEl.textContent = item.date || '';
        const dividerEl = document.createElement('span');
        dividerEl.className = 'timeline__divider';
        dividerEl.textContent = '|';
        li.appendChild(dateEl);
        li.appendChild(dividerEl);
        if (typeof item.page === 'number') {
          const jumpBtn = document.createElement('button');
          jumpBtn.className = 'timeline__action timeline__jump';
          jumpBtn.type = 'button';
          jumpBtn.textContent = '↗';
          jumpBtn.dataset.page = String(item.page);
          if (item.aria) {
            jumpBtn.setAttribute('aria-label', item.aria);
          }
          jumpBtn.addEventListener('click', () => navigateToPage(item.page));
          li.appendChild(jumpBtn);
        }
        const textEl = document.createElement('span');
        textEl.className = 'timeline__text';
        textEl.innerHTML = item.text || '';
        if (item.link) {
          textEl.appendChild(document.createTextNode(' '));
          textEl.appendChild(createLinkElement(item.link));
        }
        li.appendChild(textEl);
        listEl.appendChild(li);
      });
    }

    function renderSkills(container, groups) {
      if (!container) return;
      container.innerHTML = '';
      if (!Array.isArray(groups)) return;
      groups.forEach((group) => {
        const groupEl = document.createElement('div');
        groupEl.className = 'skill-group';
        const heading = document.createElement('h4');
        heading.textContent = group.title || '';
        groupEl.appendChild(heading);
        const tagGrid = document.createElement('div');
        tagGrid.className = 'tag-grid';
        (group.tags || []).forEach((tag) => {
          const tagEl = document.createElement('span');
          const styleClass = group.style === 'secondary' ? 'tag--secondary' : 'tag--primary';
          tagEl.className = `tag ${styleClass}`;
          tagEl.textContent = tag;
          tagGrid.appendChild(tagEl);
        });
        groupEl.appendChild(tagGrid);
        container.appendChild(groupEl);
      });
    }

    function applyCopy(copy) {
      currentCopy = copy;
      currentLang = copy.lang || currentLang;
      document.documentElement.lang = currentLang;
      if (copy.meta) {
        document.title = copy.meta.title || document.title;
        const metaDesc = document.querySelector('meta[name=\"description\"]');
        if (metaDesc && copy.meta.description) {
          metaDesc.setAttribute('content', copy.meta.description);
        }
      }
      setText(bannerEl, copy.bannerTitle);
      if (languageToggleBtn) {
        languageToggleBtn.dataset.activeLang = currentLang;
        const ariaLabel = copy.languageToggle?.aria || 'Toggle language';
        languageToggleBtn.setAttribute('aria-label', ariaLabel);
      }
      if (copy.themeToggle?.label) {
        setText(themeToggleText, copy.themeToggle.label);
      }
      const heroCopy = copy.hero || {};
      setText(heroEyebrowText, heroCopy.eyebrow);
      setText(heroTitleEl, heroCopy.title);
      renderList(heroBulletList, heroCopy.bullets || []);
      if (heroPhoto) {
        heroPhoto.setAttribute('aria-label', heroCopy.photoAria || '');
      }
      if (heroPhotoImg) {
        heroPhotoImg.alt = heroCopy.photoAlt || '';
      }
      const overviewCopy = copy.overview || {};
      setText(overviewTitleEl, overviewCopy.title);
      renderList(overviewBulletList, overviewCopy.bullets || [], { html: true });
      const cards = copy.cards || {};
      setText(educationTitleEl, cards.education?.title);
      renderTimeline(educationListEl, cards.education?.items || []);
      setText(experienceTitleEl, cards.experience?.title);
      renderTimeline(experienceListEl, cards.experience?.items || []);
      setText(projectsTitleEl, cards.projects?.title);
      renderTimeline(projectsListEl, cards.projects?.items || []);
      setText(awardsTitleEl, cards.awards?.title);
      renderTimeline(awardsListEl, cards.awards?.items || []);
      setText(patentTitleEl, cards.patents?.title);
      renderTimeline(patentListEl, cards.patents?.items || []);
      setText(skillsTitleEl, cards.skills?.title);
      renderSkills(skillGroupsEl, cards.skills?.groups || []);
      const pdfCopy = copy.pdf || {};
      setText(pdfTitleEl, pdfCopy.title);
      setText(pdfDownloadEl, pdfCopy.download);
      setText(pdfOpenEl, pdfCopy.open);
      setText(prevBtn, pdfCopy.prev);
      setText(nextBtn, pdfCopy.next);
      pdfAltTemplate = pdfCopy.imageAlt || 'Portfolio page {page}';
      updateViewer();
      if (footerEl && copy.footer) {
        const year = new Date().getFullYear();
        footerEl.textContent = copy.footer.replace('%YEAR%', year);
      }
      applyTheme(activeTheme, false);
    }

    async function loadCopy(lang) {
      const path = LANGUAGE_FILES[lang];
      if (!path) {
        throw new Error(`Unsupported language: ${lang}`);
      }
      if (contentCache[lang]) {
        return contentCache[lang];
      }
      const response = await fetch(path);
      if (!response.ok) {
        throw new Error(`Failed to load ${path}`);
      }
      const data = await response.json();
      contentCache[lang] = data;
      return data;
    }

    let isLanguageLoading = false;
    async function setLanguage(lang) {
      if (isLanguageLoading) return;
      isLanguageLoading = true;
      if (languageToggleBtn) {
        languageToggleBtn.disabled = true;
      }
      try {
        const copy = await loadCopy(lang);
        applyCopy(copy);
      } catch (error) {
        console.error('Failed to load language copy:', error);
      } finally {
        isLanguageLoading = false;
        if (languageToggleBtn) {
          languageToggleBtn.disabled = false;
          languageToggleBtn.dataset.activeLang = currentLang;
        }
      }
    }

    function applyTheme(theme, persist = true) {
      document.body.classList.toggle('dark', theme === 'dark');
      if (themeToggleBtn && themeToggleIcon) {
        themeToggleIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
        const label = theme === 'dark'
          ? (currentCopy?.themeToggle?.switchToLight || FALLBACK_THEME_LABELS.light)
          : (currentCopy?.themeToggle?.switchToDark || FALLBACK_THEME_LABELS.dark);
        themeToggleBtn.setAttribute('aria-label', label);
      }
      if (themeToggleText && currentCopy?.themeToggle?.label) {
        setText(themeToggleText, currentCopy.themeToggle.label);
      }
      if (persist) {
        localStorage.setItem('theme', theme);
      }
    }

    const storedTheme = localStorage.getItem('theme');
    let activeTheme = storedTheme === 'dark' || storedTheme === 'light'
      ? storedTheme
      : (prefersDark.matches ? 'dark' : 'light');

    applyTheme(activeTheme, false);

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        activeTheme = document.body.classList.contains('dark') ? 'light' : 'dark';
        applyTheme(activeTheme);
      });
    }

    const handlePrefersChange = (event) => {
      const hasStoredTheme = localStorage.getItem('theme');
      if (hasStoredTheme === null) {
        activeTheme = event.matches ? 'dark' : 'light';
        applyTheme(activeTheme, false);
      }
    };

    if (typeof prefersDark.addEventListener === 'function') {
      prefersDark.addEventListener('change', handlePrefersChange);
    } else if (typeof prefersDark.addListener === 'function') {
      prefersDark.addListener(handlePrefersChange);
    }

    function showThumbs(event) {
      if (!heroPhoto || !thumbsPop) return;
      const rect = heroPhoto.getBoundingClientRect();
      const hasPointer = event && typeof event.clientX === 'number' && typeof event.clientY === 'number';
      const x = hasPointer ? event.clientX - rect.left : rect.width / 2;
      const y = hasPointer ? event.clientY - rect.top : rect.height / 2;
      thumbsPop.style.left = `${x}px`;
      thumbsPop.style.top = `${y}px`;
      thumbsPop.classList.remove('is-active');
      void thumbsPop.offsetWidth;
      thumbsPop.classList.add('is-active');
    }

    if (thumbsPop) {
      thumbsPop.addEventListener('animationend', () => {
        thumbsPop.classList.remove('is-active');
      });
    }

    if (heroPhoto) {
      heroPhoto.addEventListener('click', (event) => {
        showThumbs(event);
      });
      heroPhoto.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          showThumbs(event);
        }
      });
    }

    function updateViewer() {
      if (!imageEl || !currentPageEl || !prevBtn || !nextBtn) return;
      const pageStr = String(currentPage).padStart(2, '0');
      imageEl.src = `${imagePrefix}${pageStr}.png?v=${currentPage}`;
      const altTemplate = pdfAltTemplate || 'Portfolio page {page}';
      imageEl.alt = altTemplate.replace('{page}', String(currentPage));
      currentPageEl.textContent = String(currentPage);
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === TOTAL_PAGES;
    }

    function navigateToPage(pageNumber) {
      if (!Number.isFinite(pageNumber)) return;
      const clamped = Math.min(Math.max(Math.round(pageNumber), 1), TOTAL_PAGES);
      if (clamped !== currentPage) {
        currentPage = clamped;
        updateViewer();
      }
      if (pdfSection) {
        pdfSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    if (prevBtn && nextBtn) {
      prevBtn.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage -= 1;
          updateViewer();
        }
      });

      nextBtn.addEventListener('click', () => {
        if (currentPage < TOTAL_PAGES) {
          currentPage += 1;
          updateViewer();
        }
      });
    }

    if (languageToggleBtn) {
      languageToggleBtn.addEventListener('click', () => {
        const nextLang = currentLang === 'ko' ? 'en' : 'ko';
        setLanguage(nextLang);
      });
    }

    updateViewer();
    setLanguage('ko');
  </script>
</body>
</html>
